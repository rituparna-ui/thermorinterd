[package]
name = "thermorinterd"
version = "0.1.0"
edition = "2021"
description = "Cross-platform BLE cat-printer daemon: HTTP print service + queue"
license = "MIT"

[[bin]]
name = "thermorinterd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
btleplug = "0.11"
futures = "0.3"
uuid = "1"
image = "0.25"
ab_glyph = "0.2"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"

[profile.release]
opt-level = 2
